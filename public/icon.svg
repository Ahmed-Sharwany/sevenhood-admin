<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Dark background -->
  <rect x="0" y="0" width="64" height="64" rx="14" fill="#0B0C0A"/>
  <defs>
    <!-- Mask: white rect filled, S-curve cut out in black -->
    <mask id="mark-mask" maskUnits="userSpaceOnUse" x="0" y="0" width="64" height="64">
      <rect x="8" y="8" width="48" height="48" rx="11" fill="white"/>
      <path d="M 46 22 C 14 22 14 32 32 32 C 50 32 50 42 18 42"
        stroke="black" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    </mask>
  </defs>
  <!-- Gold rectangle with S-curve punched through — dark bg shows as the curve -->
  <rect x="8" y="8" width="48" height="48" rx="11" fill="#C9A56B" mask="url(#mark-mask)"/>
</svg>
